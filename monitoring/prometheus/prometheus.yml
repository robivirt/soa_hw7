global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: marketplace-api
    static_configs:
      - targets:
          - api:8000

  - job_name: notification
    static_configs:
      - targets:
          - notification:8001

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
