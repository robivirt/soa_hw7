name: CI

on:
  push:
  pull_request:

jobs:
  build-test-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate OpenAPI server
        run: python scripts/generate_openapi_server.py

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Build services
        run: docker compose build

      - name: Start test environment
        run: docker compose up -d

      - name: Wait for services
        run: |
          python scripts/wait_for_http.py http://localhost:8000/health 120
          python scripts/wait_for_http.py http://localhost:8001/health 120
          python scripts/wait_for_http.py http://localhost:9090/-/ready 120

      - name: Integration tests
        run: pytest tests/integration -q

      - name: End-to-end tests
        run: pytest tests/e2e -q

      - name: Run k6 load test
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker compose run --rm k6 | tee artifacts/k6-results.txt

      - name: Validate Prometheus SLI
        run: python scripts/check_prometheus_sli.py http://localhost:9090 artifacts/prometheus-sli.json

      - name: Collect docker logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          docker compose ps > artifacts/docker-compose-ps.txt
          docker compose logs api > artifacts/logs/api.log
          docker compose logs notification > artifacts/logs/notification.log
          docker compose logs prometheus > artifacts/logs/prometheus.log
          docker compose logs grafana > artifacts/logs/grafana.log

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observability-artifacts
          path: artifacts

      - name: Stop test environment
        if: always()
        run: docker compose down -v
