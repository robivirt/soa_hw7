services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    command:
      - -url=jdbc:postgresql://db:5432/marketplace
      - -user=marketplace
      - -password=marketplace
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ACCESS_TOKEN_MINUTES: 20
      REFRESH_TOKEN_DAYS: 14
      ORDER_RATE_LIMIT_MINUTES: 1
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully

  swagger:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "${SWAGGER_PORT:-8080}:8080"
    volumes:
      - ./docs:/spec:ro
    restart: unless-stopped

volumes:
  postgres_data:
